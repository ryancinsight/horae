[package]
name = "horae-civil-time"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Gregorian dates and UTC timestamps for Atlas"
repository = "https://github.com/ryancinsight/horae"
license = "MIT OR Apache-2.0"
publish = true

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[lints]
workspace = true
