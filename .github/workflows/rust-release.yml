name: Crates.io Release

on:
  release:
    types: [published]
  push:
    branches: [main]
  schedule:
    - cron: "38 6 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to validate without publishing
        required: true
        type: string
      version:
        description: Exact Cargo package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.event.release.tag_name || inputs.package || github.event_name }}
  cancel-in-progress: false

jobs:
  semver:
    name: SemVer gate (release)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@ad3d67694dd128a000de57cb0c970789b4947e83
    with:
      release-gate: true
      package: horae-time
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  publish:
    needs: semver
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    uses: ryancinsight/atlas/.github/workflows/crates-publish.yml@ad3d67694dd128a000de57cb0c970789b4947e83
    permissions:
      contents: read
      id-token: write
    with:
      rust-toolchain: "1.97.0"
      tag-prefix: ""
      dispatch-package: ${{ inputs.package }}
      dispatch-version: ${{ inputs.version }}

  # Version-change publishing (ADR 0068, ATLAS-PUB-010): a merged version bump
  # publishes and tags itself. Only this job holds write permissions.
  publish-pending:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    uses: ryancinsight/atlas/.github/workflows/crates-publish-pending.yml@ee2b7200c4781e39b5ea3e379d2aa97947758099
    permissions:
      contents: write # release tags for the published versions
      id-token: write # OIDC trusted publishing; no stored registry token
    with:
      rust-toolchain: "1.97.0"
      tag-prefix: ""
