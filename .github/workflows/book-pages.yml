name: Deploy mdBook
on:
  push:
    branches: [main]
    paths: ["docs/book/**",".github/workflows/book-pages.yml"]
  pull_request:
    paths: ["docs/book/**",".github/workflows/book-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@6ed29a957388327d221f2716ede5575a6817ba04
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      output-path: target/book/horae
      mdbook-test: true
      rust-toolchain: "1.97.0"
      cargo-package: horae
