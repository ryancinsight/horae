[package]
name = "horae"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
description = "Atlas time-integration policy and orchestration foundation"
repository = "https://github.com/ryancinsight/horae"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["integration", "ode", "simulation", "no-std"]
categories = ["no-std", "science"]
publish = false

[dependencies]
aequitas = { version = "0.1.0", git = "https://github.com/ryancinsight/aequitas", default-features = false }
eunomia = { version = "0.8.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }

[dev-dependencies]
proptest = "1.11.0"
stats_alloc = "0.1.10"

[features]
default = ["std"]
std = ["aequitas/std", "eunomia/std"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"
overflow-checks = true

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
overflow-checks = true

[profile.release]
debug = false
strip = "symbols"
overflow-checks = true
